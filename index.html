<head>

    <style>
        /* CSS Reset & Variabel */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #07030a;
            --purple-dark: #1f0535;
            --purple-glow: #4a0e75;
            --purple-bright: #8a2be2;
            --text-light: #f5f2f7;
            --text-gray: #a39bb0;
            --silver: #d1cbd4;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Video 1:1 & Overlay */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.45;
            filter: grayscale(20%) contrast(110%);
        }

        /* Overlay Gradasi Hitam-Ungu untuk Keterbacaan Teks */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(
                135deg, 
                rgba(7, 3, 10, 0.92) 0%, 
                rgba(31, 5, 53, 0.85) 50%, 
                rgba(7, 3, 10, 0.95) 100%
            );
        }

        /* Canvas untuk Efek Partikel JS */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Container Utama */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
            z-index: 1;
        }

        /* Foto Profil (1:1 Ratio dengan bingkai gothic) */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--silver);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .profile-container:hover .profile-pic {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.7);
            border-color: var(--purple-bright);
        }

        /* Nama Band & Deskripsi */
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(138, 43, 226, 0.5);
            margin-bottom: 8px;
        }

        .bio {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--text-gray);
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Daftar Tombol Links */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px 20px;
            background-color: rgba(7, 3, 10, 0.75);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 4px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 1.2rem;
            color: var(--text-gray);
            transition: color 0.3s ease;
        }

        .link-btn:hover {
            background-color: rgba(31, 5, 53, 0.5);
            border-color: var(--purple-bright);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5), inset 0 0 10px rgba(138, 43, 226, 0.2);
        }

        .link-btn:hover i {
            color: var(--purple-bright);
        }

        .link-btn:active {
            transform: translateY(1px);
        }

        /* Footer & Social Media Icon Row */
        .social-footer {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            padding: 0 10px;
        }

        .social-icon {
            color: var(--text-gray);
            font-size: 1.4rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--purple-bright);
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.8));
        }

        .copyright {
            margin-top: 30px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: rgba(163, 155, 176, 0.4);
            text-transform: uppercase;
        }
    </style>
</head>

    <!-- JavaScript untuk Efek Partikel Melayang (Bara Ungu/Gothic Ash) -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 35;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.speedY = -(Math.random() * 0.8 + 0.2);
                this.opacity = Math.random() * 0.5 + 0.1;
                this.fadeRate = Math.random() * 0.002 + 0.001;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedX += Math.sin(this.y * 0.01) * 0.01;

                if (this.y < -10 || this.opacity <= 0) {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 10;
                    this.size = Math.random() * 3 + 1;
                    this.speedY = -(Math.random() * 0.8 + 0.2);
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(138, 43, 226, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#8a2be2';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        init();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
